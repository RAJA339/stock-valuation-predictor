# Mirrors the 60/30/10 palette in svp/theme.py — keep the two in sync.
# This styles the Streamlit chrome (menus, spinners, date pickers) that the
# injected CSS cannot reach.
#   primaryColor             = 10% accent — champagne beige
#   backgroundColor          = 60% obsidian black, deepest value
#   secondaryBackgroundColor = 60% obsidian black, card surface
#   textColor                = 30% pearl white
[theme]
base = "dark"
primaryColor = "#E3D2AE"
backgroundColor = "#0A0B0D"
secondaryBackgroundColor = "#121417"
textColor = "#F4F2ED"

[server]
maxUploadSize = 50
