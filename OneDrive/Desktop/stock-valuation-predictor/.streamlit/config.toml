# Palette mirrors svp/theme.py — brokerage-terminal dark.
# Keep these in sync: this styles Streamlit's own chrome (menus, widgets,
# spinners, date pickers) that the injected CSS cannot reach.
[theme]
base = "dark"
primaryColor = "#4C8DFF"
backgroundColor = "#0B0E11"
secondaryBackgroundColor = "#151A21"
textColor = "#E6EDF3"

[server]
maxUploadSize = 50
