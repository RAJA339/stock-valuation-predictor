[flake8]
# 100 columns suits the table-heavy layout code; 79 would force worse breaks.
max-line-length = 110
# The report builder and the indicator engine are long dispatch chains — one
# branch per section, one per indicator. Splitting them to satisfy a
# complexity cap would scatter closely related logic across helpers without
# making it easier to follow, so the cap is set above them deliberately.
max-complexity = 50
exclude = .git,__pycache__,.venv,build,dist
# E203 disagrees with black on slice spacing; W503/W504 contradict each other,
# and the operator-first style W504 permits is the readable one for long
# boolean conditions.
extend-ignore = E203,W503,W504
per-file-ignores =
    # app.py is one long Streamlit script; E501 on f-string UI copy is noise.
    # E701/E702: compact one-line guards inside the Streamlit script.
    app.py:E501,E402,E701,E702
    # theme.py aligns palette assignments in columns for scanability (E221).
    svp/theme.py:E501,E221
    svp/reports.py:E221
    svp/charts.py:E221
    # CI scripts must extend sys.path before importing the package (E402).
    ci/*.py:E402,E501,E731
    tests/*.py:E402

[tool:pytest]
testpaths = tests
python_files = test_*.py
filterwarnings =
    ignore::PendingDeprecationWarning
    ignore::DeprecationWarning
