# Continuous deployment.
#
# Flow:
#   pull request  -> terraform plan, posted as a PR comment. Nothing applied.
#   push to main  -> apply to dev, deploy the bundle, run governance, smoke test.
#   manual        -> apply to prod, gated by a GitHub Environment approval.
#
# AWS credentials come from OIDC role assumption, not from long-lived access
# keys in secrets. Databricks auth uses an OAuth service principal (M2M).

name: GenAI Lakehouse CD

on:
  pull_request:
    paths:
      - "genai-lakehouse-platform/terraform/**"
      - "genai-lakehouse-platform/governance/**"
  push:
    branches: [main]
    paths:
      - "genai-lakehouse-platform/**"
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: dev
        type: choice
        options: [dev, prod]
      apply:
        description: Apply the plan (unchecked = plan only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write      # required for AWS OIDC
  pull-requests: write # required to post the plan comment

env:
  PROJECT_DIR: genai-lakehouse-platform
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.10.5"
  AWS_REGION: us-east-1

# Never let two applies race for the same state file.
concurrency:
  group: genai-lakehouse-cd-${{ github.event.inputs.environment || 'dev' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Terraform plan (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}
    outputs:
      plan_exitcode: ${{ steps.plan.outputs.exitcode }}
    defaults:
      run:
        working-directory: genai-lakehouse-platform/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: genai-lakehouse-plan

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="envs/${TARGET_ENV}/backend.hcl"
        env:
          TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}

      - name: Plan
        id: plan
        # -detailed-exitcode: 0 = no changes, 2 = changes present, 1 = error.
        # Distinguishing "no changes" from "changes" is what lets the apply job
        # skip cleanly instead of re-running a no-op.
        continue-on-error: true
        run: |
          terraform plan -input=false -detailed-exitcode -no-color \
            -var-file="envs/${TARGET_ENV}/terraform.tfvars" \
            -out=tfplan | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        env:
          TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
          TF_VAR_databricks_client_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
          TF_VAR_databricks_client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

      - name: Fail on plan error
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment || 'dev' }}
          path: |
            genai-lakehouse-platform/terraform/tfplan
            genai-lakehouse-platform/terraform/plan.txt
          retention-days: 7

      - name: Comment plan on the pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'genai-lakehouse-platform/terraform/plan.txt';
            let plan = fs.readFileSync(path, 'utf8');
            // GitHub rejects comments over 65536 characters.
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n... plan truncated, see the workflow artifact ...';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan\n\n<details><summary>Show plan</summary>\n\n\`\`\`hcl\n${plan}\n\`\`\`\n\n</details>\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`
            });

  apply:
    name: Terraform apply (${{ github.event.inputs.environment || 'dev' }})
    runs-on: ubuntu-latest
    needs: plan
    # Applies happen on a push to main, or on an explicit manual dispatch --
    # never from a pull request, which may come from a fork.
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.apply == 'true')
    # The GitHub Environment is where the prod approval gate lives.
    environment: ${{ github.event.inputs.environment || 'dev' }}
    outputs:
      catalog: ${{ steps.outputs.outputs.catalog }}
    defaults:
      run:
        working-directory: genai-lakehouse-platform/terraform
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: genai-lakehouse-apply

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Init
        run: terraform init -input=false -backend-config="envs/${TARGET_ENV}/backend.hcl"
        env:
          TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.event.inputs.environment || 'dev' }}
          path: genai-lakehouse-platform/terraform

      - name: Apply
        # Applying the SAVED plan, not re-planning: this guarantees what was
        # reviewed is what gets applied.
        run: terraform apply -input=false -auto-approve tfplan
        env:
          TF_VAR_databricks_client_id: ${{ secrets.DATABRICKS_CLIENT_ID }}
          TF_VAR_databricks_client_secret: ${{ secrets.DATABRICKS_CLIENT_SECRET }}

      - name: Export pipeline config
        id: outputs
        run: |
          mkdir -p ../conf
          terraform output -json pipeline_config > "../conf/${TARGET_ENV}.json"
          echo "catalog=$(terraform output -raw catalog_name)" >> "$GITHUB_OUTPUT"
        env:
          TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}

      - name: Upload pipeline config
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-config-${{ github.event.inputs.environment || 'dev' }}
          path: genai-lakehouse-platform/conf/*.json
          retention-days: 7

  deploy-bundle:
    name: Deploy Databricks bundle
    runs-on: ubuntu-latest
    needs: apply
    environment: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: genai-lakehouse-platform
    env:
      TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: databricks/setup-cli@main

      - name: Download pipeline config
        uses: actions/download-artifact@v4
        with:
          name: pipeline-config-${{ github.event.inputs.environment || 'dev' }}
          path: genai-lakehouse-platform/conf

      - name: Build wheel
        run: |
          pip install --upgrade build
          python -m build --wheel

      - name: Validate bundle
        run: databricks bundle validate -t "${TARGET_ENV}"

      - name: Deploy bundle
        run: databricks bundle deploy -t "${TARGET_ENV}"

  governance:
    name: Apply governance & assert
    runs-on: ubuntu-latest
    needs: deploy-bundle
    environment: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: genai-lakehouse-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the SQL connector
        run: pip install "databricks-sql-connector>=3.0.0"

      - name: Apply RBAC, masking and audit views
        # --assert fails the deploy when a PII column lost its mask, an object
        # is owned by a person, or a privilege was granted to a user. Governance
        # drift is a deployment failure, not a ticket for next quarter.
        run: |
          python governance/apply.py \
            --catalog "${{ needs.apply.outputs.catalog }}" \
            --environment "${TARGET_ENV}" \
            --assert
        env:
          TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_WAREHOUSE_ID: ${{ secrets.DATABRICKS_WAREHOUSE_ID }}
          PII_HASH_SALT: ${{ secrets.PII_HASH_SALT }}

  smoke-test:
    name: Post-deploy smoke test
    runs-on: ubuntu-latest
    needs: governance
    environment: ${{ github.event.inputs.environment || 'dev' }}
    defaults:
      run:
        working-directory: genai-lakehouse-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install databricks-sdk databricks-vectorsearch

      - name: Download pipeline config
        uses: actions/download-artifact@v4
        with:
          name: pipeline-config-${{ github.event.inputs.environment || 'dev' }}
          path: genai-lakehouse-platform/conf

      - name: Ensure the vector index is ready and answers a query
        run: |
          python -m pipelines.gold.vector_index \
            --conf "conf/${TARGET_ENV}.json" --wait
          python scripts/retrieval_smoke_test.py --conf "conf/${TARGET_ENV}.json"
        env:
          TARGET_ENV: ${{ github.event.inputs.environment || 'dev' }}
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
