# Databricks Asset Bundle for the Real-Time GenAI Lakehouse.
#
#   databricks bundle validate -t dev
#   databricks bundle deploy   -t dev
#   databricks bundle run bronze_ingest -t dev
#
# Targets mirror the Terraform environments one-for-one. `prod` is marked as a
# production target, which makes the CLI refuse to deploy it from a user
# identity -- deploys go through the CI service principal or not at all.

bundle:
  name: genai-lakehouse

include:
  - pipelines/resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog for this target.
    default: genai_lakehouse_dev
  landing_path:
    description: UC volume Auto Loader reads from.
    default: /Volumes/genai_lakehouse_dev/bronze/landing
  checkpoint_path:
    description: UC volume holding Structured Streaming checkpoints.
    default: /Volumes/genai_lakehouse_dev/bronze/checkpoints
  kinesis_stream:
    description: Kinesis stream carrying real-time events.
    default: genai-lakehouse-dev-market-events
  aws_region:
    default: us-east-1
  vector_endpoint:
    default: genai-lakehouse-dev-vs
  instance_profile_arn:
    description: Instance profile granting Kinesis + checkpoint access.
    default: ""
  warehouse_id:
    description: SQL warehouse running the maintenance SQL task.
    default: ""
  ci_service_principal:
    description: Application id the production jobs run as.
    default: ""
  schedule_pause_status:
    description: PAUSED or UNPAUSED for the batch schedule. Only prod runs on its own.
    default: PAUSED
  node_type:
    default: m5d.xlarge
  streaming_workers:
    default: 2

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-00000000-0000.cloud.databricks.com
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: genai_lakehouse_dev
      vector_endpoint: genai-lakehouse-dev-vs
      streaming_workers: 1

  prod:
    mode: production
    workspace:
      host: https://dbc-11111111-1111.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    run_as:
      service_principal_name: ${var.ci_service_principal}
    variables:
      ci_service_principal: 00000000-0000-0000-0000-000000000000
      schedule_pause_status: UNPAUSED
      catalog: genai_lakehouse_prod
      landing_path: /Volumes/genai_lakehouse_prod/bronze/landing
      checkpoint_path: /Volumes/genai_lakehouse_prod/bronze/checkpoints
      kinesis_stream: genai-lakehouse-prod-market-events
      vector_endpoint: genai-lakehouse-prod-vs
      node_type: m5d.2xlarge
      streaming_workers: 4
    permissions:
      - level: CAN_VIEW
        group_name: data_analysts
      - level: CAN_MANAGE
        group_name: data_platform_admins
