# Continuous integration: everything that can be checked WITHOUT touching a
# cloud account. Runs on every push and pull request.
#
# NOTE ON LOCATION: GitHub Actions only reads workflows from `.github/workflows`
# at the repository ROOT. This platform lives in a subdirectory, so every job
# sets `working-directory` and a copy of this file is kept at the repo root as
# `.github/workflows/genai-lakehouse-ci.yml`. In a standalone repository,
# delete the `defaults.run.working-directory` blocks and the `paths:` filter.

name: GenAI Lakehouse CI

on:
  push:
    branches: ["**"]
    paths:
      - "genai-lakehouse-platform/**"
      - ".github/workflows/genai-lakehouse-ci.yml"
  pull_request:
    paths:
      - "genai-lakehouse-platform/**"
      - ".github/workflows/genai-lakehouse-ci.yml"
  workflow_dispatch:

env:
  PROJECT_DIR: genai-lakehouse-platform
  PYTHON_VERSION: "3.11"
  TERRAFORM_VERSION: "1.10.5"

# A second push to the same branch cancels the first: CI feedback on a commit
# nobody is looking at any more is wasted runner time.
concurrency:
  group: genai-lakehouse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genai-lakehouse-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install "ruff>=0.6"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

  test:
    name: PyTest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 matches Databricks Runtime 15.4 LTS. 3.10 is the declared floor
        # and is tested so the wheel stays installable on older runtimes.
        python-version: ["3.10", "3.11"]
    defaults:
      run:
        working-directory: genai-lakehouse-platform
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: genai-lakehouse-platform/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # Keep Spark quiet and single-machine; the suite is deterministic.
          SPARK_LOCAL_IP: 127.0.0.1
          PYSPARK_PYTHON: python
          PYSPARK_DRIVER_PYTHON: python
        run: |
          pytest tests/ \
            --cov=pipelines --cov=governance \
            --cov-report=term-missing \
            --cov-report=xml \
            --junitxml=pytest-report.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-${{ matrix.python-version }}
          path: |
            genai-lakehouse-platform/pytest-report.xml
            genai-lakehouse-platform/coverage.xml
          retention-days: 14

  terraform-validate:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genai-lakehouse-platform/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init (no backend)
        # -backend=false validates configuration without needing state access
        # or AWS credentials, which is what makes this job safe on a fork PR.
        run: terraform init -backend=false -input=false

      - name: Validate root module
        run: terraform validate -no-color

      - name: Validate each child module
        # A module declaring `configuration_aliases` cannot be validated as a
        # ROOT module: its aliased providers are supplied by the calling module,
        # so standalone validation fails with "Provider configuration not
        # present". Those modules are already covered by "Validate root module"
        # above, which instantiates them through a `providers = {}` block.
        run: |
          for module in modules/*/; do
            if grep -rq 'configuration_aliases' "${module}"; then
              echo "::notice::skipping ${module} - validated via the root module (declares configuration_aliases)"
              continue
            fi
            echo "::group::validate ${module}"
            terraform -chdir="${module}" init -backend=false -input=false
            terraform -chdir="${module}" validate -no-color
            echo "::endgroup::"
          done

  terraform-security:
    name: Terraform security scan
    runs-on: ubuntu-latest
    continue-on-error: true # advisory until the findings baseline is clean
    steps:
      - uses: actions/checkout@v4

      - name: Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: genai-lakehouse-platform/terraform
          framework: terraform
          quiet: true
          soft_fail: true
          output_format: cli

  governance-sql:
    name: Governance SQL dry run
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genai-lakehouse-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Render governance SQL for every environment
        # Renders and splits the scripts without connecting to anything. Catches
        # an unsubstituted placeholder or a malformed statement in review,
        # before it reaches a metastore.
        run: |
          for env_name in dev prod; do
            echo "::group::${env_name}"
            python governance/apply.py \
              --catalog "genai_lakehouse_${env_name}" \
              --environment "${env_name}" \
              --dry-run > "/tmp/governance-${env_name}.sql"
            wc -l "/tmp/governance-${env_name}.sql"
            echo "::endgroup::"
          done

      - name: Upload rendered SQL for review
        uses: actions/upload-artifact@v4
        with:
          name: rendered-governance-sql
          path: /tmp/governance-*.sql
          retention-days: 14

  bundle-validate:
    name: Databricks bundle validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: genai-lakehouse-platform
    # Declared at job level so the step-level `if` can read it: a step cannot
    # reliably branch on an env var defined in that same step.
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_DEV_HOST }}
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
      DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: Validate bundle (dev target)
        # Fork PRs cannot read secrets; skip rather than fail red for a reason
        # that has nothing to do with the contributor's change.
        if: env.DATABRICKS_HOST != ''
        run: databricks bundle validate -t dev

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    needs: [lint, test]
    defaults:
      run:
        working-directory: genai-lakehouse-platform
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Build
        run: |
          pip install --upgrade build
          python -m build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pipelines-wheel
          path: genai-lakehouse-platform/dist/*.whl
          retention-days: 30
